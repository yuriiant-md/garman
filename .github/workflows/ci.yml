# Checks of every push and PR: tests, types and the free evals of the stage 2 answers.
# The paid LLM judge runs only by hand (Actions → CI → Run workflow) and needs the
# ANTHROPIC_API_KEY secret (Settings → Secrets and variables → Actions).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: "Judge only the first N questions (empty: the whole run, about $0.19)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}  # never stop a paid run

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions pinned to a commit: a tag can be moved, a hash cannot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no GitHub token left in .git/config
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install (exactly uv.lock)
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q
      - name: Types
        run: uv run mypy
      - name: Answers by rules (thresholds of configs/eval.yaml, the newest run)
        run: uv run python -m scripts.score_answers
      - name: Judge calibration (agreement_min of configs/judge.yaml)
        run: uv run python -m scripts.calibrate_judge

  judge:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install (exactly uv.lock)
        run: uv sync --locked
      - name: LLM judge on the newest run (paid)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: uv run python -m scripts.judge_answers ${LIMIT:+--limit "$LIMIT"}
      - name: Keep the verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: judge
          path: results/stage2/answers/*/judge.*
          if-no-files-found: warn
