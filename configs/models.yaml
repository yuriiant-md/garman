# Models compared in stage 1. Prices are USD per 1M tokens.
anthropic:
  # Cheapest Claude model that still accepts temperature/top_p and a forced tool call;
  # newer models reject non-default temperature/top_p.
  model: claude-haiku-4-5
  timeout_s: 30        # per request; the SDK retries timeouts too
  max_retries: 3       # SDK retries 408/409/429/5xx and connection errors with exponential backoff
  max_tokens: 4096
  price_input_per_mtok: 1.0
  price_output_per_mtok: 5.0
haiku55:
  # Stage 1.3: Claude Haiku 5.5, the next Haiku, through the same forced tool call. It rejects
  # any temperature/top_p but the defaults, so it runs with the "default" sampling only.
  # With a forced tool call it answers without thinking, so the effort changes little.
  model: claude-haiku-5-5
  timeout_s: 60
  max_retries: 3
  max_tokens: 8192     # the same text is ~30% more tokens than on Haiku 4.5; own_003 has 30 indicators
  effort: medium       # the model's default, set so the config says it
  sampling: false
  price_input_per_mtok: 0.1    # prompts up to 100K tokens (ours are under 40K); above: 0.5 / 2.5
  price_output_per_mtok: 0.5
ollama:
  # Lapa 12B: Gemma 3 with a Ukrainian tokenizer, Q4_K_M GGUF imported into Ollama.
  # Used in stage 1 only; kept so its saved results keep their prices. Removed from the PC
  # on 2026-10-24, so a new run with --model lapa needs the model pulled again.
  model: lapa-v0.1.2-q4km
  timeout_s: 120       # per request; no retries: a local model that timed out once will again
  num_ctx: 32768       # Ollama silently cuts input beyond the window; own_005 alone is ~16k tokens
  price_input_per_mtok: 0.0   # local model: no token price (electricity is not counted)
  price_output_per_mtok: 0.0
openrouter:
  # Stage 1.2: GPT-4o through OpenRouter, a second paid model to compare Claude with. OpenAI has
  # deprecated it, so it is a reference point, not a candidate for production.
  model: openai/gpt-4o
  timeout_s: 60        # per request; the SDK retries timeouts too
  max_retries: 3       # SDK retries 408/409/429/5xx and connection errors with exponential backoff
  max_tokens: 4096
  price_input_per_mtok: 2.5
  price_output_per_mtok: 10.0
qwen:
  # Stage 1.2: replaces Lapa as the local model. Qwen3 reasons first by default, which breaks
  # the constrained JSON, so thinking is switched off.
  model: qwen3:14b
  timeout_s: 120
  num_ctx: 32768       # the model's own window is 40K; own_005 alone is ~16k tokens
  think: false
  price_input_per_mtok: 0.0
  price_output_per_mtok: 0.0
