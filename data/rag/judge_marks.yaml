  question: Чи є платою за користування чужими грошима сума, що рахується за кожен день прострочення, чи це пеня?
  reference: 'Це плата за користування чужими грошима, а не пеня: правова природа такої плати не залежить від встановленого договором способу її обчислення (ОП КГС ВС, справа 910/14180/18).'
  answer: |-
    За Цивільним кодексом пенею є неустойка, що обчислюється у відсотках від суми несвоєчасно виконаного грошового зобов'язання за кожен день прострочення. [ЦК, ст. 549]
    Апеляційний суд вважав, що плата за користування чужими грошовими коштами, що обчислюється за кожен день прострочення, за своєю правовою природою є пенею, а не платою за користування чужими коштами, але Верховний Суд з цим не погодився. [ВС, справа № 910/14180/18, розділ «ВСТАНОВИВ»]
    Верховний Суд вважав помилковим висновок, що плата за користування чужими грошовими коштами, яка обчислюється за кожен день прострочення виконання зобов'язання, є пенею. [ВС, справа № 910/14180/18, розділ «ВСТАНОВИВ»]
