  question: Чи нараховуються інфляційні втрати, якщо прострочення тривало неповний місяць?
  reference: 'Так, якщо прострочення в неповному місяці більше 15 днів: такий місяць рахується як один і за нього нараховується індекс інфляції; якщо 15 днів або менше, інфляційна складова за цей місяць не враховується (ОП КГС ВС, справа 910/13071/19).'
  answer: |-
    Верховний Суд вважав, що інфляційні втрати за неповний місяць прострочення нараховуються, якщо прострочення становить більше половини місяця (більше 15 днів), і не нараховуються, якщо прострочення становить half місяця або менше (від 1 до 15 днів включно). [ВС, справа № 910/13071/19, п. 38.2] [ВС, справа № 910/9374/21, п. 18]
    Верховний Суд вважав, що такий підхід до розрахунку за неповний місяць застосовується як методика, визначена у його попередній практиці. [ВС, справа № 910/9374/21, п. 18] [ВС, справа № 910/13071/19, п. 38.2]
    У конкретній справі Верховний Суд за прострочення з 17 по 31 грудня, тобто 15 днів, визнав, що інфляційна складова боргу не враховується. [ВС, справа № 910/13071/19, п. 33]

    ⚠ [ВС, справа № 910/13071/19, п. 38.2]: Це практика за ГК, що втратив чинність 28.08.2025.
