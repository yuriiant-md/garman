  question: Яку пеню платить покупець, якщо затримає оплату?
  reference: Пеню в розмірі подвійної облікової ставки НБУ від неоплаченої суми за кожний день прострочення (п. 7.2).
  answer: |-
    У вашому договорі покупець, який несвоєчасно оплатив товар, платить постачальнику пеню у розмірі подвійної облікової ставки НБУ від неоплаченої суми за кожний день прострочення. [Договір own_003, п. 7.2]
    Ставка для розрахунку пені визначається на дату прострочення. [Договір own_003, п. 7.2]
    Оплата, яка здійснюється у строки, передбачені договором, не вважається несвоєчасною, тому пеню за неї не нараховують. [Договір own_003, п. 7.2]
    За Законом про відповідальність за несвоєчасне виконання грошових зобов'язань платники сплачують за прострочку платежу пеню в розмірі, що встановлюється за згодою сторін. [Закон про несвоєчасне виконання грошових зобов'язань, ст. 1]
  correct: true
  claims:
  - n: 1
    text: У вашому договорі покупець, який несвоєчасно оплатив товар, платить постачальнику пеню у розмірі подвійної облікової ставки НБУ від неоплаченої суми за кожний день прострочення.
