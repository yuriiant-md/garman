  question: Чи може суд зменшити неустойку?
  reference: Так, якщо неустойка значно перевищує розмір збитків і є інші обставини, що мають істотне значення (ЦК, ст. 551, ч. 3).
  answer: |-
    За Цивільним кодексом суд може зменшити розмір неустойки, якщо він значно перевищує розмір збитків, та за наявності інших обставин, які мають істотне значення. [ЦК, ст. 551]
    За Цивільним кодексом суд зменшує розмір неустойки, якщо порушення зобов'язання сталося з вини кредитора (тобто з вини того, хто має отримати виконання). [ЦК, ст. 616]
    За Цивільним кодексом суд також може зменшити неустойку, якщо кредитор умисно або з необережності сприяв збільшенню збитків або не вжив заходів щодо їх зменшення. [ЦК, ст. 616]
    Господарський кодекс, що вже не діє, передбачав, що суд може зменшити надмірно великі штрафні санкції порівняно із збитками кредитора, з урахуванням ступеня виконання зобов'язання, майнового стану сторін та інших інтересів сторін. [ГК, ст. 233]

