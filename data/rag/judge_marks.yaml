  question: Що таке пеня?
  reference: Неустойка, що обчислюється у відсотках від суми несвоєчасно виконаного грошового зобов'язання за кожен день прострочення (ЦК, ст. 549, ч. 3).
  answer: |-
    За Цивільним кодексом, неустойка (штраф, пеня) – це грошова сума або інше майно, які боржник повинен передати кредиторові у разі порушення ним зобов'язання. [ЦК, ст. 549]
    За Цивільним кодексом, пеня – це неустойка, що обчислюється у відсотках від суми несвоєчасно виконаного грошового зобов'язання за кожен день прострочення виконання. [ЦК, ст. 549]
