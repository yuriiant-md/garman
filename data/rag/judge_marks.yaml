  question: Що можна зробити, якщо форс-мажор затягнувся на кілька місяців?
  reference: Якщо форс-мажор триває понад 60 календарних днів, кожна сторона може відмовитися від невиконаної частини договору, письмово повідомивши іншу за 10 календарних днів, без відшкодування збитків (п. 8.3).
  answer: |-
    У договорі сказано, що строк виконання зобов’язань продовжується на час дії форс-мажорних обставин. [Договір own_008, п. 8.3–8.4]
    У договорі сказано, що якщо форс-мажор триває понад 60 календарних днів, кожна сторона має право відмовитися від невиконаної частини договору, письмово повідомивши іншу сторону за 10 календарних днів; відшкодування збитків при цьому не потрібне. [Договір own_008, п. 8.3–8.4]
    У договорі сказано, що зміна ринкових цін та валютних курсів, фінансові труднощі сторони, порушення зобов’язань її контрагентами та відсутність у сторони коштів чи товару форс-мажором не є. [Договір own_008, п. 8.3–8.4]
    Верховний Суд у іншій справі вказав, що сторона не може посилатися на форс-мажор, якщо порушила строки повідомлення про нього, передбачені договором; тому варто повідомляти другу сторону про форс-мажор у строки, встановлені вашим договором. [ВС, справа № 905/541/16, розділ «4. Доводи особи, яка подала касаційну скаргу»]

    ⚠ [ВС, справа № 905/541/16, розділ «4. Доводи особи, яка подала касаційну скаргу»]: Це практика за ГК, що втратив чинність 28.08.2025.
