[project]
name = "garman"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts", "main.py"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# One-off generators of the finished dev set (data/synthetic/); new code goes into src/
module = ["scripts.synthetic_checks", "scripts.synthetic_render"]
ignore_errors = true
