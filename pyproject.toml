[project]
name = "garman"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
