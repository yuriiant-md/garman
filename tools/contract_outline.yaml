name: contract_outline
version: v1
side_effect: false
description: |
  Зміст одного договору: які пункти в ньому є.
  Коли викликати: треба знайти пункт на тему питання (ціна, якість, пеня, строки, форс-мажор),
  а його номер невідомий.
  Коли не викликати: номер пункту вже відомий — одразу get_clause. Не відповідай фермеру з preview:
  це лише початок пункту, умова може бути далі.
  Аргументи: contract_id — з list_contracts, наприклад "k_001".
  Повертає: пункти по порядку: number ("7.3"), section ("7. Відповідальність сторін"),
  preview (до 80 символів).
  Помилки: "403 access denied" — договір не належить цьому фермеру: не шукай обхідних шляхів,
  поясни фермеру, що доступу до чужого договору немає. "404 not found" — такого договору немає:
  звір contract_id із list_contracts.
