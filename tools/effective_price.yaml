name: effective_price
version: v1
side_effect: false
description: |
  Чиста ціна пропозиції в гривнях за тонну на складі фермера: що він реально отримає.
  Рахує сервер: курс НБУ, ПДВ, доставка до місця з плейбука фермера, знижки за якість,
  вартість очікування грошей. Кожен крок має суму й джерело.
  Коли викликати: фермер порівнює пропозиції з різним базисом, валютою, ПДВ чи строком оплати,
  або питає, скільки він отримає за тонну.
  Коли не викликати: питання про пеню (penalty_risk); питання про текст договору чи закон.
  Не рахуй ціну сам і не округлюй числа сервера.
  Аргументи — terms, лише з того, що є в тексті пропозиції чи договору:
  crop (wheat, corn, barley, sunflower, soy, rapeseed, other); amount_per_t — ціна за тонну;
  currency (UAH, USD, EUR); vat_included — true чи false, лише якщо це сказано, інакше не
  передавай; basis (EXW, FCA, CPT, DAP, FOB, DAT); place — місце поставки, як у тексті;
  payment_days — число днів відстрочки; days_type (calendar, banking); trigger — від чого
  рахується строк (prepayment, after_delivery, after_documents); vat_after_registration — true,
  якщо ПДВ платять лише після реєстрації податкової накладної; discounts — знижки за якість
  [{reason, pct}]. Числа передавай числами, не рядками. Чого в тексті немає — не вигадуй.
  Якщо тип днів чи подію в тексті не названо, не передавай поле: сервер порахує календарні дні
  від поставки й скаже про це. other — лише коли в тексті своя подія чи свій тип днів: подія
  other повернеться в missing, бо від неї строк не порахувати.
  Повертає: uah_per_t, steps [{label, uah_per_t, source, stale}], missing, stale.
  Якщо missing не порожній, ціни немає: спитай фермера саме про це й виклич ще раз.
  Якщо stale — true, скажи фермеру, що курс чи тариф застарілий.
  Помилки: "validation error" — аргумент неправильний (назва поля в тексті помилки):
  виправ його з тексту пропозиції або спитай фермера.
