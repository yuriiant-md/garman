name: list_contracts
version: v1
side_effect: false
description: |
  Договори фермера, з яким ти говориш.
  Коли викликати: фермер питає про свій договір, а contract_id ще не відомий з розмови.
  Коли не викликати: contract_id уже відомий; питання про закон чи судову практику, а не про договір.
  Аргументи: немає. Фермера визначає сервер, а не ти: чужих договорів у списку немає.
  Повертає: список із contract_id і кількістю пунктів (clauses). Поле note пояснює, чому договір
  не прочитано (скан без тексту, битий файл); такий договір не відкривай, скажи про це фермеру.
