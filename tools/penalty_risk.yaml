name: penalty_risk
version: v1
side_effect: false
description: |
  Пеня за договором у гривнях: скільки фермер заплатить чи отримає за прострочення.
  Рахує сервер і порівнює денну ставку з порогом фермера з його плейбука.
  Коли викликати: у договорі є пеня чи штраф, і фермер питає, скільки це грошей, або треба
  показати ризик пункту про відповідальність.
  Коли не викликати: питання про ціну (effective_price); пеню в договорі не вказано числом.
  Не рахуй пеню сам і не округлюй числа сервера.
  Аргументи — case: sum_uah — сума, на яку нараховується пеня (вартість товару чи прострочений
  платіж), гривні; days — днів прострочення, ціле число; amount і unit — розмір пені з договору:
  pct_per_day (% за день), nbu_rate_multiple (кратність облікової ставки НБУ, "подвійна" — 2),
  one_time_pct (разовий % від суми); cap_pct — обмеження пені у % від суми, лише якщо воно є
  в договорі, інакше не передавай.
  Повертає: uah, formula (числа для перевірки фермером), source, stale, capped, pct_per_day,
  above_threshold — денна ставка вища за поріг фермера (це червоний прапорець).
  Пеня з іншою одиницею (не одна з трьох) не рахується: покажи пункт фермеру як ризик.
  Помилки: "validation error" — аргумент неправильний (назва поля в тексті помилки):
  виправ його з тексту договору або спитай фермера.
