name: save_reminder
version: v1
side_effect: true
description: |
  Зберігає фермерові нагадування про дату з договору: оплату, поставку чи іншу подію.
  Перед записом фермер сам підтверджує дію; ти лише пропонуєш її. Нічого нікому не надсилається.
  Коли викликати: фермер просить нагадати про дату чи погоджується, коли ти пропонуєш нагадати.
  Коли не викликати: фермер нагадування не просив і на пропозицію не погодився; потрібно лише
  дізнатися дату — тоді візьми її з договору через get_clause.
  Аргументи (усі обов'язкові):
  contract_id — з list_contracts, наприклад "k_001";
  kind — payment (оплата фермерові), delivery (поставка фермером) чи other (інша дата договору);
  due_date — дата РРРР-ММ-ДД, не в минулому;
  note — 1–300 символів, про що нагадати, з пунктом договору, наприклад "оплата за пшеницю, п. 5.2".
  Якщо фермер не назвав дату чи договір і їх немає в договорі, спитай його. Не вигадуй і не
  підставляй сьогоднішню дату.
  Повертає: status (saved — збережено; exists — таке нагадування вже є, нового не створено),
  key, contract_id, kind, due_date, note. Кажи фермерові, що збережено, лише коли status saved
  чи exists. Якщо status exists, а note не та, що ти передав, на цю дату вже є інше нагадування
  того самого типу, і нове не збережено: так і скажи фермеру. Якщо фермер не підтвердив, нічого
  не збережено: не повторюй виклик, доки він сам не попросить.
